spring:
  application:
    name: reservation-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  config:
    import: optional:configtree:/run/secrets/
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: ${rabbitmq_password:guest}
    connection-timeout: 5s

server:
  port: 8080
  forward-headers-strategy: native
