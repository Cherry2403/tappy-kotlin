spring:
  application:
    name: notification-service
  config:
    import: optional:configtree:/run/secrets/
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 5s
          multiplier: 2
          max-interval: 20s
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${gmail:}
    password: ${gmail_password:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

tappy:
  public-site-url: ${PUBLIC_SITE_URL:http://localhost:3000}
  notify-email: ${notify_email:}
  from-email: ${gmail:}
