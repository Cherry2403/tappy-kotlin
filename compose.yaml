name: tappy

services:
  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "5302:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_healthy
      reservation-service:
        condition: service_healthy
    networks:
      - ingress
      - edge
      - app
    read_only: true
    tmpfs:
      - /config:mode=0700,size=16m
      - /data:mode=0700,size=16m
      - /tmp:mode=1777,size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  rabbitmq:
    image: rabbitmq:4.1-alpine
    user: "100:101"
    restart: unless-stopped
    command:
      - sh
      - -c
      - RABBITMQ_DEFAULT_USER=tappy RABBITMQ_DEFAULT_PASS="$$(cat /run/secrets/rabbitmq_password)" exec rabbitmq-server
    secrets:
      - rabbitmq_password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - queue
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  reservation-service:
    build:
      context: ./backend
      args:
        SERVICE: reservation-service
    restart: unless-stopped
    init: true
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: tappy
    secrets:
      - rabbitmq_password
    depends_on:
      rabbitmq:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - app
      - queue
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  notification-service:
    build:
      context: ./backend
      args:
        SERVICE: notification-service
    restart: unless-stopped
    init: true
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: tappy
      PUBLIC_SITE_URL: https://olive-wine.cherry.id.vn
    secrets:
      - rabbitmq_password
      - gmail
      - gmail_password
      - notify_email
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - queue
      - egress
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  ingress:
  edge:
    internal: true
  app:
    internal: true
  queue:
    internal: true
  egress:

volumes:
  rabbitmq-data:

secrets:
  rabbitmq_password:
    file: ./secrets/rabbitmq_password.txt
  gmail:
    file: ./secrets/gmail.txt
  gmail_password:
    file: ./secrets/gmail_password.txt
  notify_email:
    file: ./secrets/notify_email.txt
