<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VUUR KAT · Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Italiana&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     VuurKat — web prototype (single file, vanilla)
     A real responsive landing page: full-bleed hero, centered
     content that widens into columns, real modals on desktop.
     ============================================================ */
  :root {
    --ink: #1E1C17;
    --cream: #F0EAD8;
    --paper: #FFFFFF;
    --sand: #F7F5EC;
    --olive: #5C5A2E;
    --wine: #5E1F35;
    --serif-a: 'Marcellus', serif;
    --serif-b: 'Italiana', serif;
    --sans: 'Montserrat', system-ui, sans-serif;
    --content: 1120px;   /* max readable page width */
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--wine); }
  button { font-family: inherit; }

  /* The page fills the whole viewport at any size — no phone frame. */
  #app {
    position: relative;
    width: 100%;
    min-height: 100dvh;
    background: var(--paper);
    overflow-x: hidden;
  }

  /* centered content band used by the body sections */
  .wrap {
    width: 100%;
    max-width: var(--content);
    margin: 0 auto;
    padding-left: clamp(20px, 5vw, 64px);
    padding-right: clamp(20px, 5vw, 64px);
  }

  /* overlays: full-viewport, fixed (not trapped in a column) */
  .overlay { position: fixed; inset: 0; }
  .scrim { position: absolute; inset: 0; background: rgba(30,28,23,0.55); backdrop-filter: blur(2px); }

  /* A panel that is a bottom-sheet on phones, a centered modal on desktop */
  .panel-dock { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; }
  .panel {
    position: relative; background: #fff;
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-height: 90dvh; overflow: auto;
    animation: sheetUp 0.32s cubic-bezier(.22,.61,.36,1);
  }
  /* full-screen overlays (claim, profile, settings, collection) center + cap width on desktop */
  .screen {
    position: relative; background: #fff;
    width: 100%; min-height: 100dvh;
    display: flex; flex-direction: column;
  }
  @media (min-width: 760px) {
    .panel-dock { align-items: center; justify-content: center; padding: 32px; }
    .panel {
      max-width: 560px; border-radius: 20px;
      max-height: 86dvh;
      box-shadow: 0 30px 80px rgba(30,28,23,0.35);
      animation: popIn 0.28s cubic-bezier(.22,.61,.36,1);
    }
    .screen-dock { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 32px; }
    .screen {
      max-width: 620px; min-height: 0; max-height: 90dvh;
      border-radius: 20px; overflow: hidden;
      box-shadow: 0 30px 80px rgba(30,28,23,0.35);
      animation: popIn 0.28s cubic-bezier(.22,.61,.36,1);
    }
  }

  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes popIn { from { transform: translateY(14px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .fade { animation: fadeIn 0.25s ease; }

  /* ---- top navigation ---- */
  .site-nav {
    position: absolute; top: 0; left: 0; right: 0; z-index: 20;
    height: clamp(68px, 8vw, 104px); padding-top: env(safe-area-inset-top);
  }
  .site-nav-logo {
    display: flex; align-items: center; text-decoration: none;
    flex-shrink: 0;
  }
  .site-nav-logo img {
    width: clamp(40px, 5.2vw, 72px);
    height: auto;
    object-fit: contain;
    display: block;
  }
  .nav-icon {
    width: clamp(38px, 3.6vw, 48px); height: clamp(38px, 3.6vw, 48px);
    border-radius: 50%;
    border: 1px solid rgba(240,234,216,0.35); background: rgba(30,28,23,0.3);
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 3px;
    backdrop-filter: blur(4px);
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .nav-icon:hover { background: rgba(30,28,23,0.5); border-color: rgba(240,234,216,0.6); }
  .nav-icon svg { width: 45%; height: 45%; }

  /* ---- hero ---- */
  .hero {
    position: relative;
    min-height: 78dvh;
    display: flex; align-items: flex-end;
    overflow: hidden;
  }
  @media (min-width: 760px) { .hero { min-height: 88dvh; } }
  .hero-shade {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(30,28,23,0.55) 0%, rgba(30,28,23,0.05) 34%, rgba(30,28,23,0.92) 100%);
  }
  .hero-inner {
    position: relative; z-index: 5; color: var(--cream);
    padding-bottom: clamp(40px, 7vh, 90px); padding-top: 100px;
  }
  .hero-title {
    font-family: var(--serif-b); -webkit-text-stroke: 0.8px currentColor;
    font-size: clamp(56px, 12vw, 132px); line-height: 0.94; letter-spacing: 0.01em; outline: none;
  }
  .hero-scroll {
    display: inline-block; margin-top: 34px;
    font-family: var(--serif-a); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(240,234,216,0.8); text-decoration: none; border-bottom: 1px solid rgba(240,234,216,0.4);
    padding-bottom: 4px; transition: color 0.2s ease, border-color 0.2s ease;
  }
  .hero-scroll:hover { color: #fff; border-color: #fff; }

  /* ---- body layout: story + book ---- */
  .page-grid {
    display: grid; grid-template-columns: 1fr;
    gap: clamp(40px, 6vw, 80px);
    padding-top: clamp(48px, 8vh, 96px);
    padding-bottom: clamp(48px, 8vh, 96px);
    align-items: start;
  }
  @media (min-width: 900px) {
    .page-grid { grid-template-columns: 1.1fr 0.9fr; }
    /* book stays reasonably sized and sticks while story scrolls */
    .book-col { position: sticky; top: 96px; }
  }
  .section-title {
    font-family: var(--serif-b); -webkit-text-stroke: 0.6px currentColor;
    font-size: clamp(34px, 5vw, 52px); line-height: 1.02; letter-spacing: 0.01em;
    margin: 0; color: var(--ink);
  }
  /* cap the book width so it never becomes a giant page-tall panel on desktop */
  .book-shell { max-width: 460px; margin: 0 auto; }

  /* ---- footer ---- */
  .site-footer {
    background: var(--ink); padding: 40px 0; margin-top: 20px;
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
  }

  /* image placeholders (stand-ins for the design's image-slots) */
  .imgslot {
    position: absolute; inset: 0; width: 100%; height: 100%;
    background:
      linear-gradient(135deg, rgba(92,90,46,0.28), rgba(94,31,53,0.22)),
      var(--sand);
    background-size: cover; background-position: center;
  }
  .imgslot.hero {
    background-image:
      linear-gradient(135deg, rgba(30,28,23,0.15), rgba(94,31,53,0.15)),
      url('/picture/real_house.jpg');
    background-size: cover; background-position: center;
  }

  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
  <div id="app"></div>

<script>
"use strict";
/* =================================================================
   Vanilla state + render. No framework. One render() rebuilds the
   #app innerHTML from `state`; a click/pointer delegation layer
   drives every interaction the original DCLogic component had.
   ================================================================= */

/** @typedef {{kind:'words'|'photo', name:string}} Page */

const PLACE = 'Amsterdam canal houses';

// Real photos for the book's photo pages (from /public/picture/flip_book).
// Exact filenames — the server is case-sensitive, note the mixed .jpg/.JPG.
const FLIPBOOK = [
  'IMG_0354.jpg', 'IMG_2921.jpg', 'IMG_3023.jpg', 'IMG_3060.jpg',
  'IMG_3169.JPG', 'IMG_4001.JPG', 'IMG_5203.jpg', 'IMG_5207.jpg', 'IMG_8322.JPG',
].map((f) => '/picture/flip_book/' + encodeURIComponent(f));

// Shuffle once at load so every book photo slot gets a random order
// that stays stable while you flip/drag (re-renders won't reshuffle).
const BOOK_PHOTOS = (() => {
  const a = FLIPBOOK.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
})();
// inline background for a photo slot: index picks from the shuffled list (wraps around)
const photoBg = (i) =>
  'background-image:linear-gradient(135deg,rgba(30,28,23,0.08),rgba(94,31,53,0.06)),url(\'' + BOOK_PHOTOS[i % BOOK_PHOTOS.length] + '\');'
  + 'background-size:cover;background-position:center;';

const state = {
  // souvenir / account
  claimed: false,
  souvenirName: PLACE,
  renaming: false,

  // book viewer (7 leaves: cover, 5 pages, back)
  bp: 0,        // current leaf
  bt: 0,        // drag turn amount [-1, 1]

  // overlays
  menuOpen: false,
  accountOpen: false,
  claimOpen: false,
  cstep: 0,
  profileOpen: false,
  settingsOpen: false,
  collectionOpen: false,
  sheetOpen: false,

  // settings
  vis: 'anyone',
  tgLetter: true,
  tgFamily: true,
  tgStamp: true,

  // book editor
  /** @type {Page[]} */
  pages: [
    { kind: 'words', name: 'A letter' },
    { kind: 'photo', name: 'Full bleed' },
    { kind: 'photo', name: 'Offset pair' },
    { kind: 'words', name: 'A quote' },
  ],
  step: 'grid',    // 'grid' | 'layouts'
  pick: null,      // selected slot index
  tpl: null,       // selected template index
};

// transient (not part of render state)
let dragging = false, x0 = 0, w = 1;

const N = 7; // leaves in the book

const COLLECTION = [
  { city: 'Amsterdam', country: 'Netherlands', kind: 'Magnet', pages: '4 of 8 pages' },
  { city: 'Hạ Long',    country: 'Vietnam',     kind: 'Keychain', pages: 'no pages yet' },
  { city: 'Lisbon',    country: 'Portugal',    kind: 'Magnet', pages: '2 of 8 pages' },
];

const LAYOUT_DEFS = [
  { kind: 'words', name: 'A letter' },
  { kind: 'words', name: 'A quote' },
  { kind: 'photo', name: 'Full bleed' },
  { kind: 'photo', name: 'Offset pair' },
  { kind: 'photo', name: 'Contact sheet' },
  { kind: 'photo', name: 'Photo · note' },
];

/* --------------------------- helpers --------------------------- */
const $app = document.getElementById('app');
const ownedCount = () => (state.claimed ? 3 : 2);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ----------------------- book leaf styles ---------------------- */
function bookLeafStyle(i) {
  const cur = state.bp, t = state.bt;
  const base = 'position:absolute;inset:0;border-radius:4px;overflow:hidden;background:#fff;'
    + 'transform-origin:left center;backface-visibility:hidden;box-shadow:0 10px 26px rgba(30,28,23,0.14);';
  let deg = i < cur ? -178 : 0;
  let z = i < cur ? i : N - i;
  if (t > 0 && i === cur) { deg = -178 * t; z = N + 2; }
  if (t < 0 && i === cur - 1) { deg = -178 * (1 + t); z = N + 2; }
  return base + `transform:rotateY(${deg.toFixed(1)}deg);z-index:${z};`
    + (dragging ? '' : 'transition:transform 0.55s cubic-bezier(.22,.61,.36,1);');
}
function spineStyle() {
  const cur = state.bp, t = state.bt;
  const openAmt = Math.min(1, Math.max(0, cur > 0 ? 1 : Math.max(t, 0)));
  const op = (cur >= N - 1 ? 0 : openAmt).toFixed(2);
  return 'position:absolute;top:0;bottom:0;left:0;width:26px;z-index:30;pointer-events:none;'
    + 'background:linear-gradient(to right,rgba(30,28,23,0.30) 0%,rgba(30,28,23,0.12) 42%,rgba(30,28,23,0) 100%);'
    + `opacity:${op};transition:opacity 0.4s ease;`;
}
const bookHint = () => (state.bp === 0 ? 'drag to open' : (state.bp >= N - 1 ? 'the end' : 'drag to turn'));
const bookLabel = () => (state.bp === 0 ? 'COVER' : (state.bp >= N - 1 ? 'BACK' : '0' + state.bp + ' / 05'));

/* the 7 book leaves as static HTML (only their transform changes) */
function bookLeaves() {
  const name = state.souvenirName;
  const leaves = [];

  // 00 front cover
  leaves.push(`<div class="leaf" data-leaf="0" style="${bookLeafStyle(0)}">
    <div style="position:absolute;inset:0;background:var(--wine);"></div>
    <div style="position:absolute;left:0;top:0;bottom:0;width:16px;background:linear-gradient(to right,rgba(0,0,0,0.35),rgba(0,0,0,0));"></div>
    <div style="position:absolute;inset:0;padding:34px 28px;display:flex;flex-direction:column;justify-content:space-between;color:var(--cream);">
      <div style="font-family:var(--serif-a);font-size:8px;letter-spacing:0.32em;text-transform:uppercase;color:rgba(240,234,216,0.7);">VUUR KAT · edition n°1</div>
      <svg viewBox="0 0 210 130" style="width:100%;height:auto;" fill="none" stroke="#F0EAD8" stroke-linecap="round" stroke-linejoin="round">
        <g stroke-width="1.5" opacity="0.95">
          <path d="M18 124 L18 48 L33 31 L48 48 L48 124 Z"></path>
          <path d="M52 124 L52 40 L67 22 L82 40 L82 124 Z"></path>
          <path d="M86 124 L86 55 L101 36 L116 55 L116 124 Z"></path>
          <path d="M120 124 L120 44 L135 27 L150 44 L150 124 Z"></path>
          <path d="M154 124 L154 59 L169 42 L184 59 L184 124 Z"></path>
        </g>
        <g stroke-width="1.1" opacity="0.8">
          <path d="M26 64 h13 M26 86 h13 M26 106 h13"></path>
          <path d="M60 56 h13 M60 78 h13 M60 100 h13"></path>
          <path d="M94 70 h13 M94 92 h13"></path>
          <path d="M128 60 h13 M128 82 h13 M128 104 h13"></path>
          <path d="M162 74 h13 M162 96 h13"></path>
        </g>
        <g stroke-width="1.2" opacity="0.85">
          <path d="M33 25 v-9 M33 16 h8 M41 16 v4"></path>
          <path d="M6 124 h198"></path>
        </g>
      </svg>
      <div>
        <div style="font-family:var(--serif-b);-webkit-text-stroke:0.6px currentColor;font-size:38px;line-height:1;letter-spacing:0.02em;">${esc(name)}</div>
        <div style="font-family:var(--serif-a);font-size:11px;letter-spacing:0.08em;color:rgba(240,234,216,0.75);margin-top:8px;">two days, one hook, no plan</div>
      </div>
    </div>
  </div>`);

  // 01 letter
  leaves.push(`<div class="leaf" data-leaf="1" style="${bookLeafStyle(1)}">
    <div style="position:absolute;inset:13px;border:1px solid rgba(92,90,46,0.4);border-radius:14px;"></div>
    <div style="position:absolute;inset:34px 32px;display:flex;flex-direction:column;">
      <div style="display:flex;justify-content:flex-end;font-family:var(--serif-a);font-size:12px;letter-spacing:0.12em;color:rgba(30,28,23,0.5);">2 JULY 2026</div>
      <div style="margin-top:auto;margin-bottom:auto;">
        <div style="font-family:var(--serif-b);-webkit-text-stroke:0.6px currentColor;font-size:40px;line-height:1.05;letter-spacing:0.01em;color:var(--ink);">Dear future<br>kid,</div>
        <div style="width:36px;height:1px;background:rgba(92,90,46,0.6);margin:20px 0;"></div>
        <div style="font-size:13px;line-height:1.85;color:rgba(30,28,23,0.75);">We came here with no plan and stayed by the water until it got dark. Your mother swears the hook above us was for hauling sofas up the front of the house. She was right.</div>
      </div>
      <div style="font-family:var(--serif-a);font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:rgba(30,28,23,0.4);">AMSTERDAM · page one</div>
    </div>
  </div>`);

  // 02 full bleed
  leaves.push(`<div class="leaf" data-leaf="2" style="${bookLeafStyle(2)}">
    <div class="imgslot" style="${photoBg(0)}"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(30,28,23,0.78) 0%,rgba(30,28,23,0) 45%);"></div>
    <div style="position:absolute;left:26px;right:26px;bottom:28px;color:var(--cream);">
      <div style="font-family:var(--serif-b);-webkit-text-stroke:0.5px currentColor;font-size:32px;line-height:1.05;letter-spacing:0.01em;">The morning<br>we found it</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:14px;">
        <span style="font-family:var(--serif-a);font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--cream);border:1px solid rgba(240,234,216,0.6);border-radius:3px;padding:4px 7px;">on site</span>
        <span style="font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(240,234,216,0.75);">Jul 27 · 08:14</span>
      </div>
    </div>
  </div>`);

  // 03 editorial pair
  leaves.push(`<div class="leaf" data-leaf="3" style="${bookLeafStyle(3)}">
    <div style="position:absolute;inset:0;padding:26px 24px;display:flex;flex-direction:column;">
      <div style="display:flex;align-items:flex-start;gap:14px;">
        <div style="font-family:var(--serif-b);font-size:62px;line-height:0.8;color:rgba(92,90,46,0.5);">03</div>
        <div style="font-size:11px;line-height:1.7;letter-spacing:0.02em;color:rgba(30,28,23,0.6);padding-top:6px;">two hours later,<br>same street</div>
      </div>
      <div style="position:relative;flex:1;margin-top:16px;">
        <div style="position:absolute;top:0;left:0;width:62%;height:58%;"><div class="imgslot" style="${photoBg(1)}"></div></div>
        <div style="position:absolute;bottom:0;right:0;width:58%;height:52%;box-shadow:-8px -8px 0 #fff;"><div class="imgslot" style="${photoBg(2)}"></div></div>
      </div>
      <div style="font-family:var(--serif-a);font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:rgba(30,28,23,0.4);margin-top:16px;">the hook, twice</div>
    </div>
  </div>`);

  // 04 quote
  leaves.push(`<div class="leaf" data-leaf="4" style="${bookLeafStyle(4)}">
    <div style="position:absolute;inset:0;background:var(--wine);"></div>
    <div style="position:absolute;inset:13px;border:1px solid rgba(240,234,216,0.35);border-radius:14px;"></div>
    <div style="position:absolute;inset:40px 34px;display:flex;flex-direction:column;justify-content:center;color:var(--cream);">
      <div style="font-family:var(--serif-b);-webkit-text-stroke:0.6px currentColor;font-size:36px;line-height:1.18;letter-spacing:0.01em;">“We stayed until the lights came on in every window.”</div>
      <div style="width:36px;height:1px;background:rgba(240,234,216,0.6);margin:24px 0 16px;"></div>
      <div style="font-family:var(--serif-a);font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:rgba(240,234,216,0.7);">Jul 27 · 21:40</div>
    </div>
  </div>`);

  // 05 add yours
  leaves.push(`<div class="leaf" data-leaf="5" style="${bookLeafStyle(5)}">
    <div style="position:absolute;inset:13px;border:1px dashed rgba(92,90,46,0.5);border-radius:14px;"></div>
    <div style="position:absolute;inset:40px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;">
      <div style="width:62px;height:62px;border-radius:50%;border:1px solid rgba(92,90,46,0.5);display:flex;align-items:center;justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5C5A2E" stroke-width="1.2" stroke-linecap="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"></path><circle cx="12" cy="13" r="3.4"></circle></svg>
      </div>
      <div style="font-family:var(--serif-b);-webkit-text-stroke:0.5px currentColor;font-size:32px;line-height:1.1;letter-spacing:0.01em;color:var(--ink);">Add today</div>
      <div style="font-size:12.5px;line-height:1.75;color:rgba(30,28,23,0.6);max-width:210px;">Photos taken here are stamped with the place and the hour.</div>
    </div>
  </div>`);

  // 06 back cover
  leaves.push(`<div class="leaf" data-leaf="6" style="${bookLeafStyle(6)}">
    <div style="position:absolute;inset:0;background:var(--wine);"></div>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:rgba(240,234,216,0.8);">
      <div style="width:40px;height:1px;background:rgba(240,234,216,0.5);"></div>
      <div style="font-family:var(--serif-b);-webkit-text-stroke:0.4px currentColor;font-size:22px;letter-spacing:0.14em;">VUUR KAT</div>
      <div style="font-family:var(--serif-a);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(240,234,216,0.55);">the end, for now</div>
    </div>
  </div>`);

  return leaves.join('');
}

function bookDots() {
  let out = '';
  for (let i = 0; i < N; i++) {
    const on = i === state.bp;
    out += `<span style="display:block;height:3px;border-radius:4px;transition:width .35s ease,background .35s ease;width:${on ? '22px' : '10px'};background:${on ? '#5C5A2E' : 'rgba(30,28,23,0.22)'};"></span>`;
  }
  return out;
}

const arrowStyle = (side, shown) =>
  `position:absolute;top:50%;transform:translateY(-50%);${side}:-15px;width:40px;height:40px;border-radius:50%;`
  + 'border:1px solid rgba(30,28,23,0.1);background:#fff;color:var(--ink);font-family:Georgia,serif;font-size:21px;line-height:1;cursor:pointer;z-index:40;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 16px rgba(30,28,23,0.16);transition:opacity .25s ease;'
  + (shown ? 'opacity:1;' : 'opacity:0;pointer-events:none;');

/* --------------------------- main page ------------------------- */

function usedText() { return state.pages.filter((p) => p.kind === 'words').length; }
function usedPhoto() { return state.pages.filter((p) => p.kind === 'photo').length; }
function kindLeft(k) {
  const used = k === 'words' ? usedText() : usedPhoto();
  const cap = k === 'words' ? 3 : 5;
  const replacing = state.pick != null && state.pick < state.pages.length;
  const back = replacing && state.pages[state.pick].kind === k ? 1 : 0;
  return cap - used + back;
}

function sheetOverlay() {
  if (!state.sheetOpen) return '';
  const pages = state.pages;
  const pick = state.pick;
  const replacing = pick != null && pick < pages.length;
  const full = !replacing && pages.length >= 8;
  const title = state.step === 'grid' ? 'Edit your book' : (replacing ? 'Change layout' : 'New page');
  const backLabel = state.step === 'grid' ? 'Done' : '‹ Back';
  const sub = state.step === 'grid'
    ? 'Tap a page to change or remove it. Tap a blank one to add.'
    : 'Your words and photos move into the layout you pick.';

  let inner;
  if (state.step === 'grid') {
    const tq = (on) => `display:block;height:3px;flex:1;border-radius:3px;background:${on ? 'rgba(30,28,23,0.15)' : '#5C5A2E'};`;
    let wordsQ = '', photoQ = '';
    for (let i = 0; i < 3; i++) wordsQ += `<span style="${tq(i >= usedText())}"></span>`;
    for (let i = 0; i < 5; i++) photoQ += `<span style="${tq(i >= usedPhoto())}"></span>`;

    let grid = '';
    for (let i = 0; i < 8; i++) {
      const p = pages[i];
      const on = pick === i;
      const art = (p && MINI[p.name] ? MINI[p.name] : [null, null, null, null])
        .map((css) => `<div style="${css || 'display:none;'}"></div>`).join('');
      const thumb = 'position:relative;width:100%;aspect-ratio:3 / 4;border-radius:7px;overflow:hidden;background:#fff;'
        + (p ? 'border:1px solid rgba(92,90,46,0.3);' : 'border:1px dashed rgba(92,90,46,0.5);')
        + (on ? 'box-shadow:0 0 0 2px #5C5A2E,0 0 0 5px rgba(92,90,46,0.16);' : '');
      const num = 'position:absolute;left:4px;bottom:4px;min-width:15px;height:15px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--serif-a);font-size:9px;letter-spacing:0.04em;'

      'A quote': `<div style="position:relative;width:100%;aspect-ratio:3 / 4;background:#5E1F35;border-radius:6px;overflow:hidden;margin-bottom:10px;">
        <div style="position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;"><span style="height:6px;background:rgba(240,234,216,0.85);display:block;"></span><span style="height:6px;background:rgba(240,234,216,0.85);display:block;width:80%;"></span><span style="height:6px;background:rgba(240,234,216,0.5);display:block;width:45%;"></span></div></div>`,
      'Full bleed': `<div style="position:relative;width:100%;aspect-ratio:3 / 4;background:#fff;border-radius:6px;overflow:hidden;margin-bottom:10px;">
        <div style="position:absolute;inset:0;background:rgba(92,90,46,0.3);"></div><div style="position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(to top,rgba(30,28,23,0.75),rgba(30,28,23,0));"></div><div style="position:absolute;left:12px;bottom:12px;height:6px;width:55%;background:rgba(240,234,216,0.9);"></div></div>`,
      'Offset pair': `<div style="position:relative;width:100%;aspect-ratio:3 / 4;background:#fff;border:1px solid rgba(92,90,46,0.2);border-radius:6px;overflow:hidden;margin-bottom:10px;">
        <div style="position:absolute;left:12px;top:14px;width:58%;height:42%;background:rgba(92,90,46,0.32);"></div><div style="position:absolute;right:12px;bottom:14px;width:54%;height:38%;background:rgba(92,90,46,0.55);box-shadow:-5px -5px 0 #fff;"></div></div>`,
      'Contact sheet': `<div style="position:relative;width:100%;aspect-ratio:3 / 4;background:#fff;border:1px solid rgba(92,90,46,0.2);border-radius:6px;overflow:hidden;margin-bottom:10px;">
        <div style="position:absolute;inset:12px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5px;"><span style="background:rgba(92,90,46,0.3);display:block;"></span><span style="background:rgba(92,90,46,0.55);display:block;"></span><span style="background:rgba(92,90,46,0.55);display:block;"></span><span style="background:rgba(92,90,46,0.3);display:block;"></span></div></div>`,
      'Photo · note': `<div style="position:relative;width:100%;aspect-ratio:3 / 4;background:#fff;border:1px solid rgba(92,90,46,0.2);border-radius:6px;overflow:hidden;margin-bottom:10px;">
        <div style="position:absolute;left:12px;right:12px;top:16px;height:46%;background:rgba(92,90,46,0.32);"></div><div style="position:absolute;left:12px;right:12px;bottom:22px;display:flex;flex-direction:column;gap:4px;"><span style="height:5px;background:rgba(30,28,23,0.65);display:block;width:62%;"></span><span style="height:3px;background:rgba(30,28,23,0.2);display:block;"></span></div></div>`,
    };
    let cards = '';
    for (let i = 0; i < LAYOUT_DEFS.length; i++) {
      const d = LAYOUT_DEFS[i];
      const avail = kindLeft(d.kind) > 0 && !full;
      if (sel === i && !avail) selOk = false;
      const st = tplBase + `border:1px solid ${sel === i && avail ? '#5C5A2E' : 'rgba(92,90,46,0.22)'};`
        + (sel === i && avail ? 'box-shadow:0 0 0 2px rgba(92,90,46,0.25);' : '')
        + (avail ? 'cursor:pointer;opacity:1;' : 'cursor:default;opacity:0.35;');
      const meta = d.kind === 'words' ? 'words' : (d.name === 'Offset pair' ? '2 photos' : d.name === 'Contact sheet' ? '4 photos' : '1 photo');
      cards += `<button ${avail ? `data-act="pickT" data-i="${i}"` : ''} type="button" style="${st}">
        ${thumbs[d.name]}
        <div style="font-family:var(--serif-b);font-size:19px;letter-spacing:0.01em;">${d.name}</div>
        <div style="font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(30,28,23,0.45);margin-top:3px;">${meta}</div>
      </button>`;
    }
    const confirmLabel = !selOk ? (full ? 'All 8 pages used' : 'Pick one above') : (replacing ? 'Replace this page' : 'Add this page');
    const confirmStyle = 'width:100%;margin-top:22px;border:none;border-radius:14px;padding:17px;font-family:var(--serif-a);font-size:15px;letter-spacing:0.04em;'
      + (!selOk ? 'background:rgba(92,90,46,0.15);color:rgba(30,28,23,0.45);cursor:default;' : 'background:var(--wine);color:#fff;cursor:pointer;');
    inner = `<div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">${cards}</div>
      <button data-act="confirmLayout" type="button" style="${confirmStyle}">${confirmLabel}</button>
    </div>`;
  }

  return `<div class="overlay fade panel-dock" style="z-index:60;">
    <div class="scrim" data-act="closeSheet"></div>
    <div class="panel" style="max-width:620px;padding:14px clamp(22px,4vw,32px) 30px;">
      <div style="width:40px;height:4px;border-radius:4px;background:rgba(30,28,23,0.18);margin:0 auto 18px;"></div>
      <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:4px;">
        <div style="font-family:var(--serif-b);-webkit-text-stroke:0.5px currentColor;font-size:32px;letter-spacing:0.01em;color:var(--ink);">${title}</div>
        <button data-act="sheetBack" type="button" style="background:transparent;border:none;font-family:var(--serif-a);font-size:13px;color:rgba(30,28,23,0.5);cursor:pointer;padding:0 0 6px;">${backLabel}</button>
      </div>
      <div style="font-size:12px;line-height:1.7;color:rgba(30,28,23,0.6);margin-bottom:18px;">${sub}</div>
      ${inner}
    </div>
  </div>`;
}

/* ------------------------------ render ------------------------- */
function render() {
  $app.innerHTML = mainView()
    + accountOverlay() + menuOverlay() + claimOverlay()
    + profileOverlay() + settingsOverlay() + collectionOverlay()
    + sheetOverlay();
}

/* --------------------------- actions --------------------------- */
const actions = {
  // hero / rename
  startRename() {
    state.renaming = true; render();
    const el = $app.querySelector('[data-el="title"]');
    if (el) { el.focus(); const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  },
  // book viewer
  bookPrev() { state.bp = Math.max(0, state.bp - 1); state.bt = 0; render(); },
  bookNext() { state.bp = Math.min(N - 1, state.bp + 1); state.bt = 0; render(); },
  // account sheet
  openAccount() { state.accountOpen = true; render(); },
  closeAccount() { state.accountOpen = false; render(); },
  // menu sheet
  openMenu() { state.menuOpen = true; render(); },
  closeMenu() { state.menuOpen = false; render(); },
  releaseSouvenir() { state.claimed = false; state.menuOpen = false; render(); },
  // claim flow
  startClaim() { state.menuOpen = false; state.claimOpen = true; state.cstep = 0; render(); },
  claimNext() { const next = Math.min(2, state.cstep + 1); if (next >= 2) state.claimed = true; state.cstep = next; render(); },
  claimBack() { if (state.cstep === 0) state.claimOpen = false; else state.cstep -= 1; render(); },
  closeClaim() { state.claimOpen = false; render(); },
  finishClaim() { state.claimOpen = false; state.collectionOpen = true; render(); },
  // profile / settings
  openProfile() { state.profileOpen = true; state.accountOpen = false; render(); },
  closeProfile() { state.profileOpen = false; render(); },
  openSettings() { state.settingsOpen = true; state.accountOpen = false; render(); },
  closeSettings() { state.settingsOpen = false; render(); },
  setVis(el) { state.vis = el.dataset.vis; render(); },
  toggle(el) { const k = el.dataset.key; state[k] = !state[k]; render(); },
  // collection
  openCollection() { state.collectionOpen = true; state.menuOpen = false; state.accountOpen = false; state.profileOpen = false; state.settingsOpen = false; render(); },
  closeCollection() { state.collectionOpen = false; render(); },
  collectionTap() { state.collectionOpen = false; state.accountOpen = false; state.menuOpen = false; render(); },
  // editor sheet
  openSheet() { state.sheetOpen = true; state.step = 'grid'; state.pick = null; state.tpl = null; render(); },
  closeSheet() { state.sheetOpen = false; render(); },
  sheetBack() { if (state.step === 'grid') state.sheetOpen = false; else { state.step = 'grid'; state.tpl = null; } render(); },
  slotTap(el) { state.pick = Number(el.dataset.i); state.tpl = null; render(); },
  goLayouts() {
    const replacing = state.pick != null && state.pick < state.pages.length;
    const full = !replacing && state.pages.length >= 8;
    if (!full || replacing) { state.step = 'layouts'; render(); }
  },
  deletePage() { const i = state.pick; state.pages = state.pages.filter((_, j) => j !== i); state.pick = null; render(); },
  pickT(el) { state.tpl = Number(el.dataset.i); render(); },
  confirmLayout() {
    const sel = state.tpl;
    if (sel == null || sel < 0) return;
    const replacing = state.pick != null && state.pick < state.pages.length;
    const full = !replacing && state.pages.length >= 8;
    if (kindLeft(LAYOUT_DEFS[sel].kind) <= 0 || (full && !replacing)) return;
    const next = state.pages.slice();
    if (replacing) next[state.pick] = LAYOUT_DEFS[sel];
    else next.push(LAYOUT_DEFS[sel]);
    state.pages = next; state.step = 'grid'; state.pick = null; state.tpl = null; render();
  },
};

/* ------------------------ event delegation --------------------- */
$app.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const fn = actions[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t); }
});

// commit inline rename on blur / Enter
$app.addEventListener('blur', (e) => {
  if (e.target.dataset && e.target.dataset.el === 'title') {
    const v = (e.target.textContent || '').trim();
    state.souvenirName = v || PLACE;
    state.renaming = false;
    render();
  }
}, true);
$app.addEventListener('keydown', (e) => {
  if (e.target.dataset && e.target.dataset.el === 'title' && e.key === 'Enter') {
    e.preventDefault(); e.target.blur();
  }
});

/* --------------------- book drag-to-turn ----------------------- */
$app.addEventListener('pointerdown', (e) => {
  const stage = e.target.closest('[data-el="bookstage"]');
  if (!stage) return;
  if (e.target.closest('[data-act]')) return; // let arrows work
  dragging = true;
  x0 = e.clientX;
  w = stage.offsetWidth || 320;
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
});
$app.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  let v = -(e.clientX - x0) / w;
  if (state.bp >= N - 1 && v > 0) v = 0;
  if (state.bp <= 0 && v < 0) v = 0;
  v = Math.round(Math.max(-1, Math.min(1, v)) * 100) / 100;
  if (v === state.bt) return;
  state.bt = v;
  // only mutate the affected leaves' transforms — avoid full re-render mid-drag
  for (let i = 0; i < N; i++) {
    const leaf = $app.querySelector(`.leaf[data-leaf="${i}"]`);
    if (leaf) leaf.style.cssText = bookLeafStyle(i);
  }
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  const v = state.bt;
  if (v > 0.28) state.bp = Math.min(N - 1, state.bp + 1);
  else if (v < -0.28) state.bp = Math.max(0, state.bp - 1);
  state.bt = 0;
  render();
}
$app.addEventListener('pointerup', endDrag);
$app.addEventListener('pointercancel', endDrag);

render();
</script>
</body>
</html>
